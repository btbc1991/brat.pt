<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#ffffff;
    color:#111111;

    font-family:'Inter',sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    text-align:center;

}

.container{

    max-width:700px;
    padding:40px;

    animation:fade 1.2s ease;

}

.line{

    width:120px;
    height:1px;

    background:#d9d9d9;

    margin:0 auto 45px;

}

h1{

    font-size:72px;
    letter-spacing:12px;
    font-weight:700;

    margin-bottom:35px;

}

.subtitle{

    font-size:24px;
    color:#666;

    font-weight:300;

    margin-bottom:40px;

}

.description{

    font-size:20px;
    line-height:1.8;
    color:#555;

    margin-bottom:60px;

}

a{

    text-decoration:none;

    color:#111;

    border:1px solid #111;

    padding:16px 42px;

    display:inline-block;

    letter-spacing:2px;

    font-size:15px;

    font-weight:600;

    transition:.25s;

}

a:hover{

    background:#111;
    color:white;

    transform:translateY(-2px);

}

.footer{

    margin-top:60px;

    font-size:13px;

    letter-spacing:4px;

    color:#999;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@media(max-width:700px){

h1{

font-size:48px;
letter-spacing:8px;

}

.subtitle{

font-size:20px;

}

.description{

font-size:18px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="line"></div>

</p>

<p class="description">

</p>

</div>
